<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="220">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bg-glow" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#05070d"/>
    </radialGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8; #818cf8; #c084fc; #38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8; #c084fc; #38bdf8; #818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc; #38bdf8; #818cf8; #c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d8b4fe" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow-heavy" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur1"/>
      <feGaussianBlur stdDeviation="6" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Background Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.5"/>
      <circle cx="30" cy="30" r="1" fill="#38bdf8" opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=Fira+Code:wght@400;600&amp;display=swap');

    .bg { fill: url(#bg-glow); }
    .grid-bg { fill: url(#grid); }

    /* Title Styling */
    .title-text {
      font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
      font-weight: 700;
      font-size: 46px;
      fill: url(#text-grad);
      letter-spacing: -0.5px;
    }

    .subtitle-text {
      font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
      font-weight: 500;
      font-size: 18px;
      fill: #94a3b8;
      letter-spacing: 2px;
    }

    .code-tag {
      font-family: 'Fira Code', monospace;
      font-size: 13px;
      fill: #38bdf8;
      opacity: 0.9;
    }

    /* Keyframe Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }

    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-15px) translateX(10px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }

    @keyframes dashStream {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes nodePulse {
      0%, 100% { r: 3px; opacity: 0.5; }
      50% { r: 6px; opacity: 1; }
    }

    /* Animation Classes */
    .pulse-orb-1 { animation: pulseGlow 6s ease-in-out infinite; transform-origin: 15% 30%; }
    .pulse-orb-2 { animation: pulseGlow 8s ease-in-out infinite 1s; transform-origin: 85% 70%; }
    
    .p1 { animation: floatParticle 5s ease-in-out infinite; }
    .p2 { animation: floatParticle 7s ease-in-out infinite 1.5s; }
    .p3 { animation: floatParticle 6s ease-in-out infinite 3s; }

    .stream-line {
      stroke-dasharray: 200 400;
      animation: dashStream 12s linear infinite;
    }

    .node { animation: nodePulse 3s ease-in-out infinite; }
    .node-delay1 { animation-delay: 1s; }
    .node-delay2 { animation-delay: 2s; }
  </style>

  <!-- Base Layer -->
  <rect width="900" height="220" class="bg" rx="16"/>
  <rect width="900" height="220" class="grid-bg" rx="16"/>

  <!-- Glow Orbs in Background -->
  <circle cx="120" cy="60" r="140" fill="#0ea5e9" opacity="0.15" filter="url(#glow-heavy)" class="pulse-orb-1"/>
  <circle cx="780" cy="160" r="160" fill="#8b5cf6" opacity="0.15" filter="url(#glow-heavy)" class="pulse-orb-2"/>

  <!-- Cyber Wave / Neural Network Connections -->
  <g opacity="0.4" filter="url(#glow-subtle)">
    <path class="stream-line" d="M -50,160 Q 200,60 450,150 T 950,80" fill="none" stroke="url(#accent-cyan)" stroke-width="2"/>
    <path class="stream-line" d="M -50,80 Q 250,180 550,70 T 950,140" fill="none" stroke="url(#accent-purple)" stroke-width="1.5" style="animation-duration: 9s; animation-direction: reverse;"/>
  </g>

  <!-- Network Nodes -->
  <g fill="#38bdf8" filter="url(#glow-subtle)">
    <circle cx="140" cy="120" class="node" />
    <circle cx="220" cy="60" class="node node-delay1" />
    <circle cx="310" cy="160" class="node node-delay2" />
    <circle cx="720" cy="70" class="node node-delay1" />
    <circle cx="810" cy="140" class="node" />

    <line x1="140" y1="120" x2="220" y2="60" stroke="#0ea5e9" stroke-width="0.8" opacity="0.3"/>
    <line x1="220" y1="60" x2="310" y2="160" stroke="#0ea5e9" stroke-width="0.8" opacity="0.3"/>
    <line x1="720" y1="70" x2="810" y2="140" stroke="#8b5cf6" stroke-width="0.8" opacity="0.3"/>
  </g>

  <!-- Floating Particles -->
  <circle cx="80" cy="180" r="2" fill="#38bdf8" class="p1"/>
  <circle cx="280" cy="40" r="2.5" fill="#c084fc" class="p2"/>
  <circle cx="650" cy="180" r="1.5" fill="#38bdf8" class="p3"/>
  <circle cx="840" cy="50" r="2" fill="#818cf8" class="p1"/>

  <!-- Outer Frame -->
  <rect x="1" y="1" width="898" height="218" rx="15" fill="none" stroke="url(#primary-grad)" stroke-width="1.5" opacity="0.4"/>

  <!-- Main Header Content -->
  <g transform="translate(450, 110)" text-anchor="middle">
    <!-- Top Status Badge -->
    <g transform="translate(0, -52)">
      <rect x="-115" y="-14" width="230" height="26" rx="13" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <rect x="-115" y="-14" width="230" height="26" rx="13" fill="url(#accent-cyan)" opacity="0.15"/>
      <circle cx="-95" cy="-1" r="4" fill="#10b981">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="-82" y="3" class="code-tag" text-anchor="start" font-weight="600">AI &amp; FULL-STACK ENGINEER</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="10" class="title-text" filter="url(#glow-subtle)">Yahya Bouchak</text>

    <!-- Subtitle -->
    <text x="0" y="44" class="subtitle-text">BUILDING INTELLIGENT SYSTEMS &amp; SCALABLE PLATFORMS</text>

    <!-- Terminal Tags -->
    <g transform="translate(0, 68)" opacity="0.8">
      <text x="0" y="0" class="code-tag" font-size="11">
        <tspan fill="#818cf8">&lt;</tspan>
        <tspan fill="#38bdf8">DeepLearning</tspan>
        <tspan fill="#94a3b8"> | </tspan>
        <tspan fill="#c084fc">ComputerVision</tspan>
        <tspan fill="#94a3b8"> | </tspan>
        <tspan fill="#38bdf8">WebArchitecture</tspan>
        <tspan fill="#818cf8"> /&gt;</tspan>
      </text>
    </g>
  </g>
</svg>
